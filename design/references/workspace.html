t,update}=useApp();const [q,Q]=useState('');function send(v:string){if(!v.trim())return;let k=/precision|FP|الدقة الإيجابية/i.test(v)?'precision':/recall|FN|مقام|استدعاء/i.test(v)?'recall':'scope';update({messages:[...(p.messages||[]),{q:v.trim(),k}]});Q('')}return \u003cdiv className=\"tutor\">\u003cdiv className=\"sectionTitle\">\u003cspan className=\"sq lavender\">\u003cI n=\"spark\"/>\u003c/span>\u003cdiv>\u003ch3>{t('معلّم تِلوا','Tilwa tutor')}\u003c/h3>\u003csmall>{t('محاكاة محلية','Local simulation')}\u003c/small>\u003c/div>\u003c/div>\u003cp>{t('اسأل عن المقاييس في الجلسة دي.','Ask about the metrics in this session.')}\u003c/p>{(p.messages||[]).map((m,i)=>\u003cdiv className=\"exchange\" key={i}>\u003cp className=\"question\" dir=\"auto\">{m.q}\u003c/p>{m.k==='scope'?\u003cp>{t('المحاكاة تشرح Precision وRecall. اختَر سؤال المقام أدناه.','This demo explains Precision and Recall. Try the denominator prompt below.')}\u003c/p>:\u003c>\u003cp lang=\"ar\" dir=\"rtl\">{m.k==='recall'?'في الـRecall بنبدأ بكل الحالات الإيجابية فعلًا، سواء اكتشفها النموذج (TP) أو فوّتها (FN). عشان كده المقام هو مجموع الاتنين.':'في الـPrecision بنبدأ بكل الحالات اللي النموذج توقّعها إيجابية. المقام بيضم الصح (TP) والإنذارات الخاطئة (FP).'}\u003c/p>\u003cp dir=\"ltr\" lang=\"en\">{m.k==='recall'?'Recall asks “How many actual positives did we find?” 6 of the 10 actual positives were detected.':'Precision asks “How many positive predictions were correct?” 6 of 26 were correct.'}\u003c/p>\u003ccode>{m.k==='recall'?'6 / (6 + 4) = 60%':'6 / (6 + 20) ≈ 23%'}\u003c/code>\u003csmall dir=\"ltr\">Lecture 4, pp. 13–15\u003c/small>\u003c/>}\u003c/div>)}\u003cbutton className=\"prompt\" onClick={()=>send(t('ليه بنقسم على TP + FN في الـRecall؟','Why do we divide by TP + FN for Recall?'))}>{t('ليه بنقسم على TP + FN في الـRecall؟','Why do we divide by TP + FN for Recall?')}\u003c/button>\u003cform onSubmit={e=>{e.preventDefault();send(q)}}>\u003cinput aria-label={t('سؤال للمعلّم','Tutor question')} placeholder={t('اكتب سؤالك…','Ask a question…')} value={q} onChange={e=>Q(e.target.value)}/>\u003cbutton className=\"icon\" disabled={!q.trim()} aria-label={t('إرسال','Send')}>\u003cI n=\"send\"/>\u003c/button>\u003c/form>\u003c/div>}\nexport function Session(){const {s,t,p,update,go,patch}=useApp();const [outline,O]=useState(()=>window.innerWidth>1150),[tutor,T]=useState(false),[source,S]=useState(false),[pick,P]=useState\u003cnumber|null>(null);const mode=p.format||'short',last=p.attempts.at(-1);const l=(a:string,b:string,m?:string)=>s.lesson==='en'?b:s.lesson==='ar'?a:m||a;function submit(n:number){update({attempts:[...p.attempts,{id:crypto.randomUUID?.()||String(Date.now()),when:new Date().toISOString(),answer:n}],follow:''});P(null)}return \u003c>\u003cdiv className=\"breadcrumbs\">\u003cbutton onClick={()=>go('course')}>CET351\u003c/button> / {t('تقييم النماذج','Model evaluation')} / {t('المحاضرة ٤','Lecture 4')} / {t('الجلسة ٢','Session 2')}\u003c/div>\u003cdiv className=\"worktools\">\u003cBtn icon=\"outline\" onClick={()=>O(!outline)} aria-expanded={outline}>{t('محتوى المقرر','Course outline')}\u003c/Btn>\u003clabel>{t('لغة الشرح','Lesson language')} \u003cselect value={s.lesson} onChange={e=>patch({lesson:e.target.value})}>\u003coption value=\"mixed\">{t('عربي بمصطلحات إنجليزية','Arabic + English terms')}\u003c/option>\u003coption value=\"ar\">{t('العربية','Arabic')}\u003c/option>\u003coption value=\"en\">English\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv className={'workgrid '+(outline?'opened':'')}>{outline&&\u003caside className=\"outline\">\u003ch3>{t('محتوى المقرر','Course outline')}\u003c/h3>\u003cbdi>CET351\u003c/bdi>\u003cp>{t('الوحدة ٢ · تقييم النماذج','Module 2 · Model evaluation')}\u003c/p>\u003cb>{t('المحاضرة ٤ · مقاييس التصنيف','Lecture 4 · Classification metrics')}\u003c/b>\u003cp>{t('١ · أساسيات التصنيف','1 · Classification basics')}\u003c/p>\u003cstrong>{t('٢ · مصفوفة الالتباس والمقاييس','2 · Confusion matrix and metrics')}\ ن صف الحالات الإيجابية الفعلية.')}\u003c/li>\u003cli>{l('للاستدعاء، اجمع الحالات المكتشفة والمفقودة، ثم اقسم المكتشفة على المجموع.','For Recall, divide the detected positives by detected plus missed positives.','عشان تحسب Recall اجمع TP وFN، واقسم TP على المجموع.')}\u003c/li>\u003cli>{l('للدقة الإيجابية، اقسم الحالات الصحيحة على كل التنبؤات الإيجابية.','For Precision, divide the correct positive predictions by all positive predictions.','للـPrecision استخدم عمود التنبؤات الإيجابية: TP وFP.')}\u003c/li>\u003c/ol>\u003c/>:\u003c>\u003ch2>{l('مثال محلول على ١٠٠ رسالة','Worked example with 100 emails')}\u003c/h2>\u003cp>{l('من بين عشر رسائل مزعجة، اكتشف المرشّح ست رسائل وفوّت أربعًا. وصنّف عشرين رسالة سليمة بالخطأ على أنها مزعجة.','Of ten spam emails, a filter caught six and missed four. It also flagged twenty legitimate emails.','الـSpam filter لقط ٦ من ١٠ رسائل مزعجة وفوّت ٤. كمان علّم ٢٠ رسالة سليمة على إنها Spam.')}\u003c/p>\u003ccode>Recall = 6 / 10 = 60%\u003cbr/>Precision = 6 / 26 ≈ 23%\u003c/code>\u003c/>}\u003cMatrix t={l}/>\u003ccode>Precision = TP / (TP + FP)\u003cbr/>Recall = TP / (TP + FN)\u003c/code>\u003c/div>\n\u003csection className=\"practice\">\u003cspan className=\"overline coral\">\u003ci/>{t('تدريب سريع','Practice check')}\u003c/span>\u003ch2>{t('ما قيمة الـRecall؟','What is Recall?')}\u003c/h2>\u003ccode>TP = 6 &nbsp; FP = 20 &nbsp; FN = 4\u003c/code>\u003cdiv className=\"choices\">{[23,60,40].map(n=>\u003cbutton dir=\"ltr\" key={n} aria-pressed={pick===n} className={pick===n?'sel':''} onClick={()=>P(n)}>{n===23?'≈ ':''}{n}%\u003c/button>)}\u003c/div>\u003cBtn kind=\"primary\" disabled={pick===null} onClick={()=>pick!==null&&submit(pick)}>{t('سجّل الإجابة','Record answer')}\u003c/Btn>{last&&\u003cdiv className=\"feedback\" aria-live=\"polite\">\u003cstrong>{last.answer===60?t('صحيح. اكتشف النموذج ٦ من ١٠.','Correct. The model found 6 of 10.'):t('تم تسجيل المحاولة. نحتاج دليلًا إضافيًا.','Attempt recorded. More evidence is needed.')}\u003c/strong>{
